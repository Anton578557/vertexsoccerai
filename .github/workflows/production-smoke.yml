name: Production Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment
        if: github.event_name == 'push'
        run: sleep 25

      - name: Check public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --max-time 20 "https://vertexsoccerai.com/api/health?smoke=${GITHUB_SHA}" -o /tmp/health.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const required = [
            data?.ok === true,
            data?.services?.footballPipeline === true,
            data?.services?.supabase?.url === true,
            data?.services?.supabase?.publishable === true,
            data?.services?.supabase?.serverSecret === true
          ];
          if (required.every(Boolean)) process.exit(0);
          console.error(JSON.stringify(data));
          process.exit(1);
          NODE
              then
                cat /tmp/health.json
                exit 0
              fi
            fi
            echo "Health attempt ${attempt} failed; retrying..."
            sleep 12
          done
          echo "Production health check failed." >&2
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check production shell and API boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "https://vertexsoccerai.com/?smoke=${GITHUB_SHA}" -o /tmp/site.html
          grep -q 'analyzer-stability-v1.js?v=5' /tmp/site.html
          if grep -q 'data-tab="live"' /tmp/site.html; then
            echo 'Deprecated Live tab is visible in production.' >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 20 "https://vertexsoccerai.com/api/results?smoke=${GITHUB_SHA}" -o /tmp/results.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/results.json', 'utf8'));
          if (!data || typeof data !== 'object' || !data.summary || typeof data.summary !== 'object') {
            console.error(JSON.stringify(data));
            process.exit(1);
          }
          NODE

          status="$(curl --silent --output /tmp/analyze-auth.json --write-out '%{http_code}' --max-time 20 \
            'https://vertexsoccerai.com/api/analyze?home=Arsenal&away=Chelsea')"
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "Analyzer auth boundary returned HTTP $status" >&2
            cat /tmp/analyze-auth.json 2>/dev/null || true
            exit 1
          fi

      - name: Check provider mesh
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..4}; do
            if curl --fail --silent --show-error --max-time 30 "https://vertexsoccerai.com/api/provider-check?smoke=${GITHUB_SHA}" -o /tmp/providers.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/providers.json', 'utf8'));
          const p = data?.providers || {};
          const working = new Set(data?.footballMesh?.working || []);
          const required = [
            data?.ok === true,
            data?.coreOk === true,
            Number(data?.footballMesh?.workingCount || 0) >= 2,
            working.has('sportmonks'),
            working.has('footballData'),
            p?.theSportsDb?.ok === true,
            p?.supabase?.ok === true,
            p?.openWeather?.ok === true,
            p?.newsApi?.ok === true,
            p?.footballDataCoUk?.ok === true
          ];
          if (required.every(Boolean)) {
            const optional = Array.isArray(data?.optionalFailures) ? data.optionalFailures : [];
            if (optional.length) console.warn('Optional providers unavailable:', optional.join(', '));
            process.exit(0);
          }
          console.error(JSON.stringify(data));
          process.exit(1);
          NODE
              then
                cat /tmp/providers.json
                exit 0
              fi
            fi
            echo "Provider attempt ${attempt} failed; retrying..."
            sleep 15
          done
          echo "Provider mesh check failed." >&2
          cat /tmp/providers.json 2>/dev/null || true
          exit 1
