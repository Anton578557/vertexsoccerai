name: Production Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment
        run: sleep 25

      - name: Check public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "https://vertexsoccerai.com/api/health?smoke=${GITHUB_SHA}" -o /tmp/health.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const required = [
            data?.ok === true,
            data?.services?.footballPipeline === true,
            data?.services?.supabase?.url === true,
            data?.services?.supabase?.publishable === true,
            data?.services?.supabase?.serverSecret === true
          ];
          if (required.every(Boolean)) process.exit(0);
          console.error(JSON.stringify(data));
          process.exit(1);
          NODE
              then
                cat /tmp/health.json
                exit 0
              fi
            fi
            echo "Health attempt ${attempt} failed; retrying..."
            sleep 15
          done
          echo "Production health check failed." >&2
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check provider mesh
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 30 "https://vertexsoccerai.com/api/provider-check?smoke=${GITHUB_SHA}" -o /tmp/providers.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/providers.json', 'utf8'));
          const p = data?.providers || {};
          const required = [
            data?.ok === true,
            data?.coreOk === true,
            Number(data?.footballMesh?.workingCount || 0) >= 3,
            p?.apiFootball?.ok === true,
            p?.sportmonks?.ok === true,
            p?.footballData?.ok === true,
            p?.rapidApi?.ok === true,
            p?.theSportsDb?.ok === true,
            p?.supabase?.ok === true,
            p?.openWeather?.ok === true,
            p?.newsApi?.ok === true
          ];
          if (required.every(Boolean)) process.exit(0);
          console.error(JSON.stringify(data));
          process.exit(1);
          NODE
              then
                cat /tmp/providers.json
                exit 0
              fi
            fi
            echo "Provider attempt ${attempt} failed; retrying..."
            sleep 15
          done
          echo "Provider mesh check failed." >&2
          cat /tmp/providers.json 2>/dev/null || true
          exit 1
