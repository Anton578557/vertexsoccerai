name: Vertex Quality Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Run Vertex Model tests
        run: node --test tests/*.test.js

      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      - name: Guard against committed server secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys

          roots = [pathlib.Path('.')]
          skip_dirs = {'.git', 'node_modules'}
          text_ext = {'.js', '.html', '.json', '.md', '.yml', '.yaml', '.css', '.sql'}
          supabase_secret = re.compile(r'sb_secret_[A-Za-z0-9_-]{8,}')
          resend_secret = re.compile(r'\bre_[A-Za-z0-9_-]{16,}\b')
          provider_assignment = re.compile(
              r'(RAPIDAPI_KEY|API_FOOTBALL_KEY|FOOTBALL_DATA_KEY|OPENWEATHER_KEY|NEWSAPI_KEY|SPORTMONKS_API_TOKEN|RESEND_API_KEY|SUPABASE_SECRET_KEY)\s*=\s*[\"\'][^\"\']{8,}[\"\']'
          )

          findings = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_ext:
                      continue
                  if any(part in skip_dirs for part in path.parts):
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if supabase_secret.search(line):
                          findings.append(f'{path}:{lineno}: possible Supabase server secret')
                      if resend_secret.search(line) and 'process.env.RESEND_API_KEY' not in line:
                          findings.append(f'{path}:{lineno}: possible Resend server secret')
                      if provider_assignment.search(line):
                          findings.append(f'{path}:{lineno}: possible hardcoded provider secret')

          if findings:
              print('\n'.join(findings), file=sys.stderr)
              sys.exit(1)
          print('No committed server secrets detected.')
          PY

      - name: Guard model integrity
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-string 'Math.random' api lib; then
            echo 'Random output is not allowed in the analytical engine.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-string '>85%<' index.html script.js analysis-ui-*.js; then
            echo 'Hardcoded 85% accuracy display found.' >&2
            exit 1
          fi
          grep -q "Vertex Model 2.0" lib/vertex-model-v2.js
          grep -q "finalizeVertexModelV2" api/analyze.js

      - name: Verify protected API auth and rate limits
        shell: bash
        run: |
          set -euo pipefail
          grep -q "requireUser" api/analyze.js
          grep -q "requireUser" api/live.js
          grep -q "requireUser" api/upcoming.js
          grep -q "enforceRateLimit" api/analyze.js
          grep -q "enforceRateLimit" api/live.js
          grep -q "enforceRateLimit" api/upcoming.js
          test -f lib/api-auth.js
          test -f lib/rate-limit.js
          test -f auth-api-runtime-v1.js

      - name: Verify resilience and automation files
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"/api/results"' vercel.json
          grep -q "staleSeconds" lib/provider-cache.js
          grep -q "RAPID_DEFAULT_HOST" lib/football-feed.js
          test -f api/results.js
          test -f lib/model-evaluator.js
          test -f lib/model-evaluation-store.js
          test -f lib/provider-cache.js
          test -f lib/vertex-model-v2.js
          test -f tests/vertex-model-v2.test.js
          test -f contact-runtime-v1.js
          test -f api/contact.js

      - name: Guard frontend runtime stability
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'data-tab="live"' index.html; then
            echo 'Deprecated public Live tab returned to index.html.' >&2
            exit 1
          fi
          if grep -qi 'FREE BETA' index.html; then
            echo 'Deprecated Beta wording returned to the public shell.' >&2
            exit 1
          fi
          if grep -q "observer.observe(document.body" i18n.js; then
            echo 'Body-wide translation observer is forbidden because it stalls large reports.' >&2
            exit 1
          fi
          for legacy in polish-v7.js polish-v7-hotfix.js polish-v8-hotfix.js runtime-sync-v1.js granular-ui-v1.js analysis-direct-v1.js; do
            if grep -q "'${legacy}" particles.js; then
              echo "Legacy runtime loaded in production queue: ${legacy}" >&2
              exit 1
            fi
          done
          grep -q "window.VertexAnalysisUI = { acceptAnalysis }" analysis-ui-v4.js
          grep -q "ensureAnalysisUi" script.js
          grep -q "analysisInFlight" script.js
          grep -q "window.VertexAnalyzerState" analyzer-stability-v1.js
          if grep -q "window.fetch =" analyzer-stability-v1.js; then
            echo 'Analyzer stability layer must not monkey-patch window.fetch.' >&2
            exit 1
          fi
          if grep -q "createElement('script')" particles.js; then
            echo 'particles.js must remain a visual module, not a runtime loader.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ordered = [
            'i18n.js',
            'language-input-v2.js',
            'auth-api-runtime-v1.js',
            'analysis-ui-v4.js',
            'contact-runtime-v1.js',
            'polish-v8.js',
            'analyzer-input-cleanup.js',
            'analyzer-stability-v1.js',
            'script.js',
            'particles.js'
          ];
          let previous = -1;
          for (const file of ordered) {
            const current = html.indexOf(file);
            if (current < 0 || current <= previous) {
              console.error('Invalid runtime script order:', file);
              process.exit(1);
            }
            previous = current;
          }
          NODE
          echo 'Frontend runtime stability guards passed.'
