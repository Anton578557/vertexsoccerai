<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — VertexSoccer AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', sans-serif;
            background: #0a0e17;
            color: #f0f0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 100px;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; margin: 20px 0; }
        p { color: #9a9aae; margin-bottom: 30px; }
        a {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, #00d4ff, #8b5cf6);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div>
        <div class="error-code">404</div>
        <h1>PAGE NOT FOUND</h1>
        <p>The page you are looking for doesn't exist.</p>
        <a href="/">← BACK TO HOME</a>
    </div>
</body>
</html>
